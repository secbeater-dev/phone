name: Deploy static phone workbench

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Reject tracked sensitive data
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -Eiq '\.(xlsx|xls|xml|csv|tsv)$|(^|/)(private-data|private-fixtures|local-data)(/|$)|phone-(workspace|local-settings)-.*\.json$'; then
            echo "Sensitive data file pattern detected in the Git index."
            exit 1
          fi
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test
        run: node --test tests/app.test.js
      - name: Prepare public artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp .nojekyll 404.html admin.html app.js attachment-export.js index.html styles.css _site/
          mkdir -p _site/assets _site/vendor/licenses
          cp assets/Beater_icon.png assets/ai-partner.webp _site/assets/
          cp vendor/xlsx.full.min.js vendor/exceljs.min.js vendor/pdf-lib.min.js \
             vendor/fontkit.umd.min.js vendor/open-huninn-data.js _site/vendor/
          cp vendor/licenses/ExcelJS-LICENSE.txt \
             vendor/licenses/pdf-lib-LICENSE.md \
             vendor/licenses/fontkit-NOTICE.txt \
             vendor/licenses/open-huninn-LICENSE.txt _site/vendor/licenses/
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./_site"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
